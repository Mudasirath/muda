<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>connexion</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <style>
        body{
            background-image: url("image/12666442696351839.jfif");
        }
        .form-label{
        font-size: 13px;
        font-weight: 800;
        color: #555;
        padding: 10px;
       }
       .form-control{
        height: 48px;
        border: 1px solid #d7dce2;
        border-radius: 6px;
        font-size: 16px;
       }
       .btn-primary{
        height: 45px;
        background-color: rgb(89, 89, 197);
        margin-left: 120px;
        
       }
       #tete{
        margin-top: 50px;
        padding: 20px;
        border-radius: 10px;
       }
       h2{
        text-align: center;
        padding-top: 10px;
       }
       #sous-titre{
        text-align: center;
       }
       .forgot-password{
        margin-top: 30px;
       }
    </style>
</head>
<body class="container">
    <div class="row g-2" id="tete">
        <div class="col-md-4"></div>
        <div class="card col-md-4">
            <h2>Connexion Admin</h2>
            <p id="sous-titre">Connectez vous à votre
                espace <br>d'administration
            </p>
            <form action="">
                <!--Email-->
                <div class="mb-3
                text-start">
                    <label for="email" class="form-label">Adresse email</label>
                    <input type="email" id="email" class="form-control" placeholder="exemple@email.com" required>
                </div>
                <!--Mot de passse-->
                <div class="mb-3 text-start">
                    <label for="code" class="form-label">Mot de passe</label>
                    <input type="password" id="code" class="form-control" placeholder="Votre mot de passse"
                        required>
                </div>
                <!--bouton bootstrap-->
                <button type="submit" class="btn btn-primary w-50">Se connecter</button>
            </form>
            <p class="forgot-password">Mot de passe oublié ? <a href="#">Contactez l'administrateur</a></p>
        </div>
    </div>
</body>
<script src="bootstrap/js/bootstrap.min.js"></script>
</html>
